# Cluster MinIO Distribuido (Alta Disponibilidad)
# - Reemplaza el deployment simple por un StatefulSet de 4 réplicas.
# - Utiliza volumeClaimTemplates para persistencia.
# - Configurado para ser liviano en local (Minikube/Docker Desktop).
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: minioadmin
  AWS_SECRET_ACCESS_KEY: minioadmin
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: minio-config
data:
  # DNS interno del StatefulSet
  AWS_ENDPOINT_URL: http://minio.default.svc.cluster.local:9000
  AWS_REGION: us-east-1
  AQ_BUCKET: aq-data
---
# Servicio para acceso a la API y Consola
apiVersion: v1
kind: Service
metadata:
  name: minio
spec:
  type: ClusterIP
  selector:
    app: minio
  ports:
    - { name: api,     port: 9000, targetPort: 9000 }
    - { name: console, port: 9001, targetPort: 9001 }
---
# Servicio "Headless" necesario para el StatefulSet
apiVersion: v1
kind: Service
metadata:
  name: minio-inter-svc
spec:
  clusterIP: None
  selector:
    app: minio
  ports:
    - { name: api, port: 9000, targetPort: 9000 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
spec:
  serviceName: minio-inter-svc
  replicas: 4
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: minio/minio:RELEASE.2024-10-13T13-34-11Z
          args: 
            - server 
            - http://minio-{0...3}.minio-inter-svc.default.svc.cluster.local/data
            - --console-address
            - :9001
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: AWS_SECRET_ACCESS_KEY
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "250m"
          ports:
            - { name: api,     containerPort: 9000 }
            - { name: console, containerPort: 9001 }
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 1Gi
